<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 150" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');

      .logo-text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 56px;
        letter-spacing: -1.5px;
      }

      .text-connect {
        fill: #1e1b4b;
        transition: fill 0.3s ease;
      }

      @media (prefers-color-scheme: dark) {
        .text-connect {
          fill: #fdf4ff;
        }
      }

      .text-in {
        fill: url(#brandGrad);
      }
    </style>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="brandGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <g transform="translate(20, 25)">
    <path d="M 35,25 A 42,42 0 0,0 80,95" fill="none" stroke="url(#brandGrad)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 60,12 A 42,42 0 0,1 100,45" fill="none" stroke="url(#brandGrad)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 50,50 A 18,18 0 0,0 75,75" fill="none" stroke="url(#brandGrad2)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="85" cy="62" r="5" fill="#d946ef"/>
  </g>

  <text x="145" y="98" class="logo-text">
    <tspan class="text-connect">Connect</tspan><tspan class="text-in">'In</tspan>
  </text>
</svg>

