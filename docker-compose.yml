services:
  frontend:
    build: ./frontend/frontend/
#    image:
    ports:
      - "5173:5173"

  backend:
    build: ./backend/
    ports:
      - "8080:8080"

  db:
    image: mysql:8.4
    container_name: connectin_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: connectin_v2
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
