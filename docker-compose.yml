name: ${PROJECT_NAME}

services:
  db-service:
    image: mysql:8.4
    container_name: ${PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT_EXTERNAL}:${DB_PORT_INTERNAL}"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}" ]
      interval: 10s
      retries: 5
      start_period: 5s

  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-api
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db-service:
        condition: service_healthy
    ports:
      - "${API_PORT_EXTERNAL}:${API_PORT_INTERNAL}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-service:${DB_PORT_INTERNAL}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      HIBERNATE_FORMAT_SQL: ${DEBUG_SQL_FORMAT:-false}
      SPRING_JPA_SHOW_SQL: ${DEBUG_SQL_SHOW:-false}

  frontend-service:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-ui
    ports:
      - "${FRONT_PORT_EXTERNAL}:${FRONT_PORT_INTERNAL}"
    environment:
      VITE_API_URL: ${PUBLIC_API_URL}

volumes:
  db: